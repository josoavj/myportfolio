<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio de Josoa Vonjiniaina - Développeur Full Stack, expert Flutter, Backend et Cybersécurité.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Josoa Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Josoa Vonjiniaina | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0D1117;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #FFF;
      border-bottom-color: #2196F3;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #FFF;
      font-family: 'Lexend', sans-serif;
      margin-top: 20px;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Chargement...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            // 'auto' choisit HTML pour la rapidité ou CanvasKit pour la précision selon le device
            renderer: "auto",
            useColorEmoji: true,
          }).then(function(appRunner) {
            appRunner.runApp();
            // Retrait progressif du loader pour éviter le "flash" blanc
            setTimeout(function() {
              var loader = document.querySelector('#loading-container');
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() { loader.remove(); }, 400);
              }
            }, 200);
          });
        }
      });
    });
  </script>
</body>
</html>
