<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio de Josoa Vonjiniaina - Développeur Full Stack, expert Flutter, Backend et Cybersécurité.">

  <!-- Meta tags pour la Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Josoa Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Josoa Vonjiniaina | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0D1117;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #FFF;
      border-bottom-color: #2196F3;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #FFF;
      font-family: sans-serif;
      margin-top: 20px;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Chargement...</div>
  </div>

  <script>
    // Configuration Flutter 3.47+ optimisée
    window.flutterConfiguration = {
      renderer: "auto",
      useColorEmoji: true
    };

    // Fail-safe : Masquer le loader après 8s quoi qu'il arrive
    var timeout = setTimeout(removeLoader, 8000);

    function removeLoader() {
      clearTimeout(timeout);
      var loader = document.querySelector('#loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoader);
  </script>

  <!-- Bootstrap Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
