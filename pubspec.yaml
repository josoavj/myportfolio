name: myportfolio
description: Portfolio de Josoa Vonjiniaina - Full Stack Developer, spécialisé en Flutter, Linux et sécurité.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^9.0.0
  url_launcher: ^6.3.2
  http: ^1.1.0
  fl_chart: ^1.1.1
  font_awesome_flutter: ^11.0.0
  flutter_riverpod: ^3.4.3
  responsive_framework: ^1.5.1


  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-1024.png"
  image_path_android: "assets/icons/icon-1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
